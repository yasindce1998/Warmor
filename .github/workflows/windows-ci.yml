name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build all packages
        run: go build ./...

      - name: Vet Windows packages
        run: go vet ./internal/platform/... ./internal/enforcer/... ./internal/logging/... ./cmd/warmor-daemon/...

      - name: Run unit tests
        shell: bash
        run: go test -race -short -coverprofile=coverage.out ./...

      # Hosted runners are elevated, so a real ETW session against the
      # kernel providers can run here. eBPF-for-Windows cannot: it needs
      # test-signed kernel drivers, i.e. a self-hosted VM.
      - name: ETW smoke test (real kernel providers)
        shell: bash
        env:
          WARMOR_ETW_SMOKE: "1"
        run: go test -v -count=1 -run 'TestConsumerSmoke|TestStructLayout' ./internal/platform/etw/

      - name: Check coverage threshold
        shell: bash
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 40" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below 40% threshold"
            exit 1
          fi
