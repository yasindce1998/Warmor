name: Release Binaries (build only)

# Only the calling Release workflow publishes; no independent tag trigger.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      runner:
        required: true
        type: string
      goos:
        required: true
        type: string
      goarch:
        required: true
        type: string
    outputs:
      name:
        value: ${{ jobs.build.outputs.name }}
      id:
        value: ${{ jobs.build.outputs.id }}
      digest:
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  build:
    timeout-minutes: 30
    runs-on: ${{ inputs.runner }}
    outputs:
      name: binaries-${{ inputs.goos }}-${{ inputs.goarch }}
      id: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.11'
      - name: Verify native runner and exact source
        env:
          EXPECTED_OS: ${{ inputs.goos }}
          EXPECTED_ARCH: ${{ inputs.goarch }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(go env GOOS)" = "$EXPECTED_OS"
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          go mod download
          go mod verify
      - name: Native portable tests (not an ESF or driver test)
        env:
          CGO_ENABLED: '0'
        run: go test -mod=readonly -short -count=1 ./...
      - name: Build and smoke-test archive payload
        env:
          VERSION: ${{ inputs.version }}
          GOOS: ${{ inputs.goos }}
          GOARCH: ${{ inputs.goarch }}
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash scripts/release-build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: binaries-${{ inputs.goos }}-${{ inputs.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7
