name: Release Binaries (build only)

# Only the calling Release workflow publishes; no independent tag trigger.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: windows-2025
            goos: windows
            goarch: amd64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
      - name: Verify native runner and exact source
        env:
          EXPECTED_OS: ${{ matrix.goos }}
          EXPECTED_ARCH: ${{ matrix.goarch }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(go env GOOS)" = "$EXPECTED_OS"
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          go mod download
          go mod verify
      - name: Native portable tests (not an ESF or driver test)
        env:
          CGO_ENABLED: '0'
        run: go test -mod=readonly -short -count=1 ./...
      - name: Build and smoke-test archive payload
        env:
          VERSION: ${{ inputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash scripts/release-build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7
