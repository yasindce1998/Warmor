name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the gofmt step diffs against the base commit

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # Only files changed by this PR/push are checked, so pre-existing
      # formatting debt elsewhere does not fail unrelated changes.
      - name: gofmt (changed files)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.go')
          [ ${#files[@]} -eq 0 ] && { echo "No Go files changed."; exit 0; }
          unformatted=$(gofmt -l "${files[@]}")
          if [ -n "$unformatted" ]; then
            echo "::error::These changed files are not gofmt-formatted (run gofmt -w):"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt OK for ${#files[@]} changed Go file(s)."

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 40" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below 40% threshold"
            exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build daemon
        run: go build -o warmor-daemon ./cmd/warmor-daemon

      - name: Build compiler
        run: go build -o warmor-compile ./cmd/warmor-compile

      - name: Compile example YAML policy
        run: ./warmor-compile policies/yaml-example/policy.yaml -o /tmp/test-policy.wasm

  rust-policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build Rust policy crates
        run: ./scripts/build-rust-policies.sh

      - name: Evaluate each crate through the WASM host
        env:
          WARMOR_REQUIRE_POLICY_CRATES: "1"
        run: go test ./internal/wasm/ -run TestPolicyCrates -v

      # Smoke run of the performance harness (docs/PERFORMANCE.md): catches
      # benchmarks that crash or stop building. The numbers from a shared CI
      # runner are not meaningful and are not checked.
      - name: Benchmark smoke run
        env:
          QUICK: "1"
          OUT: ${{ runner.temp }}/bench-results
        run: ./scripts/bench.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: warmor:ci

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint deploy/helm/warmor/

      - name: Template Helm chart
        run: helm template warmor deploy/helm/warmor/
