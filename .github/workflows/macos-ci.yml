name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash

jobs:
  build-test:
    # Portable tooling only; this is deliberately not an ESF backend gate.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.11'

      - name: Build portable tools/stubs (not the cgo ESF backend)
        run: CGO_ENABLED=0 go build ./...

      # Go's race detector requires cgo. Enabling cgo here would also compile
      # the unverified ESF code, so do not claim a race/native backend test.
      - name: Run portable tests without race detector
        run: CGO_ENABLED=0 go test -short -coverprofile=coverage.out ./...

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 40" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below 40% threshold"
            exit 1
          fi
