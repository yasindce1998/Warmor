name: LSM-BPF Tests

on:
  push:
    branches: [main]
    paths:
      - "bpf/**"
      - "internal/ebpf/**"
      - "internal/enforcer/**"
      - "internal/generationvm/**"
      - "internal/platform/**"
      - "internal/streaming/**"
      - "tests/integration/generation_daemon_test.go"
      - "tests/integration/outcomes_test.go"
      - "tests/integration/helpers_test.go"
      - "tests/integration/generation_daemon_gate_test.go"
      - "tests/integration/run-generation-daemon.sh"
      - "internal/compiler/**"
      - "internal/kernelmap/**"
      - "internal/wasm/**"
      - "pkg/api/**"
      - "cmd/warmor-daemon/**"
      - ".github/workflows/lsm-test.yml"
      - "ci/kernel/**"
      - "scripts/build-ci-kernel.sh"
      - "tests/integration/run-kernel-generations.sh"
      - "tests/integration/kernel_generations_gate_test.go"
      - "tests/integration/run-vm.sh"
      - "tests/integration/workflow_test.go"
  pull_request:
    branches: [main]
    paths:
      - "bpf/**"
      - "internal/ebpf/**"
      - "internal/enforcer/**"
      - "internal/generationvm/**"
      - "internal/platform/**"
      - "internal/streaming/**"
      - "tests/integration/generation_daemon_test.go"
      - "tests/integration/outcomes_test.go"
      - "tests/integration/helpers_test.go"
      - "tests/integration/generation_daemon_gate_test.go"
      - "tests/integration/run-generation-daemon.sh"
      - "internal/compiler/**"
      - "internal/kernelmap/**"
      - "internal/wasm/**"
      - "pkg/api/**"
      - "cmd/warmor-daemon/**"
      - ".github/workflows/lsm-test.yml"
      - "ci/kernel/**"
      - "scripts/build-ci-kernel.sh"
      - "tests/integration/run-kernel-generations.sh"
      - "tests/integration/kernel_generations_gate_test.go"
      - "tests/integration/run-vm.sh"
      - "tests/integration/workflow_test.go"
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests (exact identities, serialization)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run identity, static-rule, and serialization tests
        run: go test -v -race -short -p 1 ./internal/ebpf/... ./internal/compiler/... ./internal/wasm/...

  bpf-compile:
    name: BPF Compilation Check (Clang ${{ matrix.clang }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        clang: [18, 21]
    env:
      BPF2GO_CC: clang-${{ matrix.clang }}
      BPF2GO_STRIP: llvm-strip-${{ matrix.clang }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install BPF build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          # Noble ships LLVM 18, but not 21. Add only the versioned LLVM 21
          # archive, scoped to its fingerprint-verified key (no remote script).
          if [ '${{ matrix.clang }}' = 21 ]; then
            key_dir="$(mktemp -d)"
            trap 'rm -rf "$key_dir"' EXIT
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              https://apt.llvm.org/llvm-snapshot.gpg.key -o "$key_dir/llvm.asc"
            fingerprint="$(gpg --batch --with-colons --show-keys "$key_dir/llvm.asc" | awk -F: '$1 == "pub" { primary = 1; next } primary && $1 == "fpr" { print $10; primary = 0 }')"
            test "$fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
            gpg --batch --dearmor -o "$key_dir/llvm.gpg" "$key_dir/llvm.asc"
            sudo install -m 0644 "$key_dir/llvm.gpg" /usr/share/keyrings/warmor-llvm.gpg
            echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/warmor-llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' \
              | sudo tee /etc/apt/sources.list.d/warmor-llvm21.list
            sudo apt-get update --error-on=any
          fi
          apt-cache policy clang-${{ matrix.clang }} llvm-${{ matrix.clang }}
          sudo apt-get install -y clang-${{ matrix.clang }} llvm-${{ matrix.clang }} libbpf-dev linux-headers-$(uname -r) gcc-multilib
          clang-${{ matrix.clang }} --version
          llvm-strip-${{ matrix.clang }} --version

      - name: Compile LSM exec program
        run: |
          clang-${{ matrix.clang }} -g -O2 -target bpf -D__TARGET_ARCH_x86 -mcpu=v1 \
            -I/usr/include/bpf -I./bpf \
            -I/usr/include/x86_64-linux-gnu \
            -c bpf/lsm_exec.bpf.c -o /tmp/lsm_exec.bpf.o

      - name: Compile LSM file program
        run: |
          clang-${{ matrix.clang }} -g -O2 -target bpf -D__TARGET_ARCH_x86 -mcpu=v1 \
            -I/usr/include/bpf -I./bpf \
            -I/usr/include/x86_64-linux-gnu \
            -c bpf/lsm_file.bpf.c -o /tmp/lsm_file.bpf.o

      - name: Compile LSM connect program
        run: |
          clang-${{ matrix.clang }} -g -O2 -target bpf -D__TARGET_ARCH_x86 -mcpu=v1 \
            -I/usr/include/bpf -I./bpf \
            -I/usr/include/x86_64-linux-gnu \
            -c bpf/lsm_connect.bpf.c -o /tmp/lsm_connect.bpf.o

      - name: Compile LSM bind program
        run: |
          clang-${{ matrix.clang }} -g -O2 -target bpf -D__TARGET_ARCH_x86 -mcpu=v1 \
            -I/usr/include/bpf -I./bpf \
            -I/usr/include/x86_64-linux-gnu \
            -c bpf/lsm_bind.bpf.c -o /tmp/lsm_bind.bpf.o

      - name: Compile LSM listen program
        run: |
          clang-${{ matrix.clang }} -g -O2 -target bpf -D__TARGET_ARCH_x86 -mcpu=v1 \
            -I/usr/include/bpf -I./bpf \
            -I/usr/include/x86_64-linux-gnu \
            -c bpf/lsm_listen.bpf.c -o /tmp/lsm_listen.bpf.o

      - name: Compile LSM ptrace program
        run: |
          clang-${{ matrix.clang }} -g -O2 -target bpf -D__TARGET_ARCH_x86 -mcpu=v1 \
            -I/usr/include/bpf -I./bpf \
            -I/usr/include/x86_64-linux-gnu \
            -c bpf/lsm_ptrace.bpf.c -o /tmp/lsm_ptrace.bpf.o

      - name: Compile LSM mount program
        run: |
          clang-${{ matrix.clang }} -g -O2 -target bpf -D__TARGET_ARCH_x86 -mcpu=v1 \
            -I/usr/include/bpf -I./bpf \
            -I/usr/include/x86_64-linux-gnu \
            -c bpf/lsm_mount.bpf.c -o /tmp/lsm_mount.bpf.o

      - name: Compile monitor programs
        run: make -C bpf all CLANG='clang-${{ matrix.clang }} -mcpu=v1'

      - name: Check regenerated generation ABI and compile VM fixtures offline
        env:
          BPF2GO_CFLAGS: -D__TARGET_ARCH_x86 -mcpu=v1
        run: |
          go generate ./internal/ebpf
          go test -count=1 -run '^TestGenerationObject' ./internal/ebpf
          go test -race -count=1 ./internal/ebpf
          go test -tags integration -run '^$' ./internal/ebpf

      - name: Verify BPF object files
        run: |
          for obj in /tmp/lsm_exec.bpf.o /tmp/lsm_file.bpf.o /tmp/lsm_connect.bpf.o /tmp/lsm_bind.bpf.o /tmp/lsm_listen.bpf.o /tmp/lsm_ptrace.bpf.o /tmp/lsm_mount.bpf.o; do
            echo "=== $(basename $obj) ==="
            llvm-objdump-${{ matrix.clang }} -h "$obj" | head -20
            echo ""
          done

  lsm-integration:
    name: LSM Integration (${{ matrix.kernel }})
    runs-on: ubuntu-latest
    needs: [unit-tests, bpf-compile]
    # Validate CO-RE relocations and LSM attach across kernels with different
    # struct layouts. ci-kernels only builds the -selftests variant (the one
    # with CONFIG_BPF_LSM=y + BTF) for its release *channels*, not its numeric
    # version tags, so those three channels are the only BPF-LSM-capable images
    # available upstream:
    #   longterm  = oldest of the three  (currently ~6.18)
    #   stable    = current stable        (the primary gate, ~6.19)
    #   mainline  = newest / -rc          (early warning, allowed to fail, ~7.0)
    # Older LTS coverage (6.1) comes from the IMA kernels built below.
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel: longterm-selftests
            experimental: false
          - kernel: stable-selftests
            experimental: false
          - kernel: mainline-selftests
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 clang llvm libbpf-dev gcc-multilib
          sudo chmod 0666 /dev/kvm
          CGO_ENABLED=0 go install lmb.io/vimto@latest

      # Keep the -type flags in sync with the //go:generate directives in
      # internal/ebpf, so the generated bindings match the committed ones.
      - name: Generate BPF bindings (replaces stubs with real loaders)
        env:
          BPF_CFLAGS: "-I../../bpf -I/usr/include/bpf -I/usr/include/x86_64-linux-gnu -D__TARGET_ARCH_x86"
          GOPACKAGE: ebpf
        run: |
          cd internal/ebpf
          go run github.com/cilium/ebpf/cmd/bpf2go -type warmor_event -type policy_key -type policy_value -type lsm_config lsm_exec ../../bpf/lsm_exec.bpf.c -- $BPF_CFLAGS
          go run github.com/cilium/ebpf/cmd/bpf2go -type warmor_event lsm_file ../../bpf/lsm_file.bpf.c -- $BPF_CFLAGS
          go run github.com/cilium/ebpf/cmd/bpf2go lsm_connect ../../bpf/lsm_connect.bpf.c -- $BPF_CFLAGS
          go run github.com/cilium/ebpf/cmd/bpf2go lsm_bind ../../bpf/lsm_bind.bpf.c -- $BPF_CFLAGS
          go run github.com/cilium/ebpf/cmd/bpf2go lsm_listen ../../bpf/lsm_listen.bpf.c -- $BPF_CFLAGS
          go run github.com/cilium/ebpf/cmd/bpf2go lsm_ptrace ../../bpf/lsm_ptrace.bpf.c -- $BPF_CFLAGS
          go run github.com/cilium/ebpf/cmd/bpf2go lsm_mount ../../bpf/lsm_mount.bpf.c -- $BPF_CFLAGS
          go run github.com/cilium/ebpf/cmd/bpf2go -type digest_key -type integrity_config lsm_integrity ../../bpf/lsm_integrity.bpf.c -- $BPF_CFLAGS
          go run github.com/cilium/ebpf/cmd/bpf2go -type execve_event execve_monitor ../../bpf/execve_monitor.bpf.c -- $BPF_CFLAGS
          go run github.com/cilium/ebpf/cmd/bpf2go -type file_event openat_monitor ../../bpf/openat_monitor.bpf.c -- $BPF_CFLAGS
          go run github.com/cilium/ebpf/cmd/bpf2go -type network_event connect_monitor ../../bpf/connect_monitor.bpf.c -- $BPF_CFLAGS
          rm -f generated_stubs.go

      - name: Run LSM integration tests in VM
        run: |
          CGO_ENABLED=0 $(go env GOPATH)/bin/vimto \
            -kernel ghcr.io/cilium/ci-kernels:${{ matrix.kernel }} -- \
            go test -v -count 1 -tags integration -timeout 120s ./internal/ebpf/

  # The ci-kernels images are built without IMA, so the exec integrity tests
  # only skip on them. Build the same configuration plus IMA (ci/kernel/),
  # once per version and config: the result is cached.
  ima-kernel:
    name: Build IMA kernel (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Current longterm, and the oldest LTS the BPF programs target.
        version: ["6.18.53", "6.1.188"]
    steps:
      - uses: actions/checkout@v4

      - name: Restore kernel cache
        id: cache
        uses: actions/cache@v4
        with:
          path: kernel-out
          key: ima-kernel-${{ matrix.version }}-${{ hashFiles('ci/kernel/**', 'scripts/build-ci-kernel.sh') }}

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison bc cpio libelf-dev libssl-dev dwarves

      - name: Build kernel
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build-ci-kernel.sh ${{ matrix.version }} kernel-out

      - name: Show IMA and LSM configuration
        run: grep -E "^CONFIG_(IMA|IMA_DEFAULT_HASH|BPF_LSM|LSM)=" kernel-out/config

      - uses: actions/upload-artifact@v4
        with:
          name: ima-kernel-${{ matrix.version }}
          path: kernel-out
          retention-days: 7

  lsm-integration-ima:
    name: LSM Integration with IMA (${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: [unit-tests, bpf-compile, ima-kernel]
    strategy:
      fail-fast: false
      matrix:
        version: ["6.18.53", "6.1.188"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/download-artifact@v4
        with:
          name: ima-kernel-${{ matrix.version }}
          path: kernel-out

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          sudo chmod 0666 /dev/kvm
          CGO_ENABLED=0 go install lmb.io/vimto@latest

      # The committed bindings are used as is; the bpf-compile job checks the
      # C sources still build.
      - name: Run LSM integration tests in VM (integrity required)
        env:
          WARMOR_REQUIRE_IMA: "1"
        run: |
          CGO_ENABLED=0 $(go env GOPATH)/bin/vimto \
            -kernel "$GITHUB_WORKSPACE/kernel-out/vmlinuz" -- \
            go test -v -count 1 -tags integration -timeout 300s ./internal/ebpf/

  kernel-generations-strict:
    name: Required generation verifier/outcomes (${{ matrix.version }})
    runs-on: ubuntu-24.04
    needs: [unit-tests, bpf-compile, ima-kernel]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "6.1.188"
            minor: "6.1"
          - version: "6.18.53"
            minor: "6.18"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: ima-kernel-${{ matrix.version }}
          path: kernel-out
      - name: Install VM and BPF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 clang llvm libbpf-dev gcc-multilib
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          else
            echo VIMTO_DISABLE_KVM=1 >> "$GITHUB_ENV"
          fi
          CGO_ENABLED=0 go install lmb.io/vimto@v0.4.0
      - name: Regenerate exact embedded BPF inputs
        env:
          BPF2GO_CFLAGS: -D__TARGET_ARCH_x86 -mcpu=v1
        run: go generate ./internal/ebpf
      - name: Install real policy compilation target for daemon phase
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Validate strict gate oracles without enforcement
        run: |
          bash -n tests/integration/run-kernel-generations.sh tests/integration/run-vm.sh
          go test -race -count=1 -run '^(TestGenerationGate|TestVM)' ./tests/integration
          bash -n tests/integration/run-generation-daemon.sh
          go test -race -count=1 -run '^TestGenerationDaemonGate' ./tests/integration
      - name: Require actual non-skipped generation, legacy and integrity outcomes in VM
        env:
          KERNEL: ${{ github.workspace }}/kernel-out/vmlinuz
          EXPECT_KERNEL_MINOR: ${{ matrix.minor }}
        run: bash tests/integration/run-kernel-generations.sh
      - name: Require whole-daemon generation reload and pending recovery outcomes
        env:
          KERNEL: ${{ github.workspace }}/kernel-out/vmlinuz
          EXPECT_KERNEL_MINOR: ${{ matrix.minor }}
        run: bash tests/integration/run-generation-daemon.sh
      - name: Retain exact inputs and VM verdict evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-generations-${{ matrix.version }}
          path: |
            tests/integration/artifacts/generations.*/build-info.txt
            tests/integration/artifacts/generations.*/required-tests.txt
            tests/integration/artifacts/generations.*/SHA256SUMS
            tests/integration/artifacts/generations.*/*.log
            tests/integration/artifacts/generations.*/generations-status.txt
            tests/integration/artifacts/generation-daemon.*/**
          if-no-files-found: error
          retention-days: 14
