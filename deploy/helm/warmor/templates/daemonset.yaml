{{- include "warmor.validate" . }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "warmor.fullname" . }}
  labels:
    {{- include "warmor.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "warmor.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: {{ .Values.updateStrategy.type }}
    {{- if eq .Values.updateStrategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.updateStrategy.maxUnavailable }}
    {{- end }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.daemon.metricsPort | quote }}
        prometheus.io/path: "/metrics"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "warmor.selectorLabels" . | nindent 8 }}
        component: daemon
    spec:
      serviceAccountName: {{ include "warmor.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- if .Values.priorityClass.enabled }}
      priorityClassName: {{ include "warmor.priorityClassName" . }}
      {{- end }}
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if not .Values.controller.enabled }}
      # The init container re-validates a user-supplied policy before the
      # daemon starts. In controller mode it is redundant: the controller
      # only publishes policies that compiled, so a policy reaching this
      # mount is valid by construction.
      initContainers:
        - name: validate-policy
          image: {{ include "warmor.image" (dict "image" .Values.image "version" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/warmor-daemon"]
          args: ["--validate-policy", "/etc/warmor/policy.wasm"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            {{- if .Values.policy.existingConfigMap }}
            - name: policy
              mountPath: /etc/warmor
              readOnly: true
            {{- end }}
      {{- end }}
      containers:
        - name: warmor
          image: {{ include "warmor.image" (dict "image" .Values.image "version" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # The WASM runtime keeps its compile cache under os.UserCacheDir()
            # ($HOME/.cache in the distroless image). The root filesystem is
            # read-only, so point it at the writable /tmp emptyDir.
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
          args:
            {{- if .Values.controller.nodeReceipts.enabled }}
            - {{ printf "--receipt-controller=https://%s-controller-receipts.%s.svc:9443" (include "warmor.fullname" .) .Release.Namespace | quote }}
            - "--receipt-token-file=/var/run/warmor-receipts/token"
            - "--receipt-ca=/etc/warmor-receipt-ca/ca.crt"
            - "--receipt-manifest=/etc/warmor/policy.d/activation-manifest.json"
            {{- end }}
            - "-policy"
            {{- if .Values.controller.enabled }}
            # Controller mode: the effective policy the controller
            # publishes. The mount is optional so agents can start before
            # the first sync; they crash-loop briefly until it lands.
            - "/etc/warmor/policy.d/policy.wasm"
            {{- else }}
            - "/etc/warmor/policy.wasm"
            {{- end }}
            - "-metrics-port"
            - {{ .Values.daemon.metricsPort | quote }}
            - "-metrics-bind-address"
            - {{ .Values.daemon.metricsBindAddress | quote }}
            - "-cgroup-root"
            - {{ .Values.hostPaths.cgroupMount | quote }}
            - "-cgroup-reconcile-interval"
            - {{ .Values.daemon.cgroupReconcileInterval | quote }}
            - "-log-level"
            - {{ .Values.daemon.logLevel | quote }}
            - "-stats-interval"
            - {{ .Values.daemon.statsInterval | quote }}
            {{- if .Values.daemon.auditMode }}
            - "-audit"
            {{- end }}
            {{- if .Values.daemon.lsmEnforce }}
            - "-lsm-enforce"
            {{- end }}
            {{- if .Values.daemon.requireLSM }}
            - "-require-lsm"
            {{- end }}
            {{- if .Values.daemon.defaultDeny }}
            - "-default-deny"
            {{- end }}
            {{- if .Values.daemon.cgroupFilter }}
            - "-cgroup-filter"
            - {{ .Values.daemon.cgroupFilter | quote }}
            {{- end }}
          securityContext:
            privileged: false
            runAsNonRoot: false
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # SYS_ADMIN remains a legacy-kernel compatibility fallback;
              # validate the isolated capability matrix before reducing it.
              add:
                - SYS_ADMIN
                - BPF
                - PERFMON
                {{- if not .Values.daemon.auditMode }}
                - KILL
                {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.daemon.metricsPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: metrics
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.controller.nodeReceipts.enabled }}
            - name: receipt-token
              mountPath: /var/run/warmor-receipts
              readOnly: true
            - name: receipt-ca
              mountPath: /etc/warmor-receipt-ca
              readOnly: true
            {{- end }}
            {{- if .Values.controller.enabled }}
            - name: effective-policy
              mountPath: /etc/warmor/policy.d
              readOnly: true
            {{- else if .Values.policy.existingConfigMap }}
            - name: policy
              mountPath: /etc/warmor
              readOnly: true
            {{- end }}
            - name: host-kernel
              mountPath: /sys/kernel
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
            - name: host-cgroup
              mountPath: {{ .Values.hostPaths.cgroupMount | quote }}
              readOnly: true
      volumes:
        {{- if .Values.controller.nodeReceipts.enabled }}
        - name: receipt-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.controller.nodeReceipts.audience | quote }}
                  expirationSeconds: 600
        - name: receipt-ca
          configMap:
            name: {{ .Values.controller.nodeReceipts.caConfigMapName | quote }}
        {{- end }}
        {{- if .Values.controller.enabled }}
        # optional: on a fresh install the controller may not have
        # published the first policy yet; the mount fills in within
        # seconds and the agents pick it up on their next start.
        - name: effective-policy
          configMap:
            name: {{ include "warmor.fullname" . }}-effective-policy
            optional: true
            items:
              - key: policy.wasm
                path: policy.wasm
              {{- if .Values.controller.nodeReceipts.enabled }}
              - key: activation-manifest.json
                path: activation-manifest.json
              {{- end }}
        {{- else if .Values.policy.existingConfigMap }}
        - name: policy
          configMap:
            name: {{ .Values.policy.existingConfigMap }}
        {{- end }}
        - name: host-kernel
          hostPath:
            path: {{ .Values.hostPaths.kernel | quote }}
            type: Directory
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            sizeLimit: 16Mi
        - name: host-cgroup
          hostPath:
            path: {{ .Values.hostPaths.cgroup | quote }}
            type: Directory
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
