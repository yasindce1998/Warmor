{{- if .Values.alerting.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "warmor.fullname" . }}
  labels:
    {{- include "warmor.labels" . | nindent 4 }}
    {{- with .Values.alerting.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: warmor.rules
      rules:
        {{- if .Values.alerting.rules.highDenyRate.enabled }}
        - alert: WarmorHighDenyRate
          expr: sum(rate(warmor_events_total{action="DENY"}[5m])) > {{ .Values.alerting.rules.highDenyRate.threshold }}
          for: {{ .Values.alerting.rules.highDenyRate.for }}
          labels:
            severity: {{ .Values.alerting.rules.highDenyRate.severity }}
          annotations:
            summary: "High deny rate detected on {{ "{{" }} $labels.instance {{ "}}" }}"
            description: "Warmor is denying more than {{ .Values.alerting.rules.highDenyRate.threshold }} events/sec over 5 minutes."
        {{- end }}
        {{- if .Values.alerting.rules.daemonDown.enabled }}
        - alert: WarmorDaemonDown
          expr: up{job=~".*warmor.*"} == 0
          for: {{ .Values.alerting.rules.daemonDown.for }}
          labels:
            severity: {{ .Values.alerting.rules.daemonDown.severity }}
          annotations:
            summary: "Warmor daemon is down on {{ "{{" }} $labels.instance {{ "}}" }}"
            description: "Warmor daemon has been unreachable for more than {{ .Values.alerting.rules.daemonDown.for }}."
        {{- end }}
        {{- if .Values.alerting.rules.highErrorRate.enabled }}
        - alert: WarmorHighErrorRate
          expr: rate(warmor_events_processing_errors_total[5m]) > {{ .Values.alerting.rules.highErrorRate.threshold }}
          for: {{ .Values.alerting.rules.highErrorRate.for }}
          labels:
            severity: {{ .Values.alerting.rules.highErrorRate.severity }}
          annotations:
            summary: "High error rate in Warmor on {{ "{{" }} $labels.instance {{ "}}" }}"
            description: "Warmor event processing errors exceed {{ .Values.alerting.rules.highErrorRate.threshold }}/sec."
        {{- end }}
        {{- if .Values.alerting.rules.ebpfLoaderFailure.enabled }}
        - alert: WarmorEBPFLoaderFailure
          expr: warmor_ebpf_loader_status == 0
          for: {{ .Values.alerting.rules.ebpfLoaderFailure.for }}
          labels:
            severity: {{ .Values.alerting.rules.ebpfLoaderFailure.severity }}
          annotations:
            summary: "Kernel enforcement not active on {{ "{{" }} $labels.instance {{ "}}" }}"
            description: "Warmor was started with kernel LSM enforcement (--lsm-enforce) but it is not active; only userspace enforcement has been running for more than {{ .Values.alerting.rules.ebpfLoaderFailure.for }}."
        {{- end }}
        {{- if .Values.alerting.rules.lsmEventsDropped.enabled }}
        - alert: WarmorLSMEventsDropped
          expr: sum(rate(warmor_lsm_events_dropped_total[5m])) by (instance, hook) > 0
          for: {{ .Values.alerting.rules.lsmEventsDropped.for }}
          labels:
            severity: {{ .Values.alerting.rules.lsmEventsDropped.severity }}
          annotations:
            summary: "Kernel LSM events dropped on {{ "{{" }} $labels.instance {{ "}}" }}"
            description: "The kernel ring buffer is full, so {{ "{{" }} $labels.hook {{ "}}" }} operations the policy map did not know were never evaluated. Raise --lsm-ringbuf-size or scope the daemon with --cgroup-filter."
        {{- end }}
        {{- if .Values.alerting.rules.wasmEvaluationErrors.enabled }}
        - alert: WarmorWASMEvaluationErrors
          expr: sum(rate(warmor_wasm_exec_errors_total[5m])) by (instance, policy_id, kind) > {{ .Values.alerting.rules.wasmEvaluationErrors.threshold }}
          for: {{ .Values.alerting.rules.wasmEvaluationErrors.for }}
          labels:
            severity: {{ .Values.alerting.rules.wasmEvaluationErrors.severity }}
          annotations:
            summary: "WASM policy evaluations failing on {{ "{{" }} $labels.instance {{ "}}" }}"
            description: "Policy {{ "{{" }} $labels.policy_id {{ "}}" }} evaluations fail ({{ "{{" }} $labels.kind {{ "}}" }}); each failure is denied (fail closed)."
        {{- end }}
        {{- if .Values.alerting.rules.policyMapSyncFailures.enabled }}
        - alert: WarmorPolicyMapSyncFailures
          expr: sum(rate(warmor_policy_map_syncs_total{result="failed"}[5m])) by (instance) > 0
          for: {{ .Values.alerting.rules.policyMapSyncFailures.for }}
          labels:
            severity: {{ .Values.alerting.rules.policyMapSyncFailures.severity }}
          annotations:
            summary: "Kernel policy map writes failing on {{ "{{" }} $labels.instance {{ "}}" }}"
            description: "Decisions cannot be written to the kernel policy map; they are still enforced in userspace, without the kernel fast path."
        {{- end }}
{{- end }}
