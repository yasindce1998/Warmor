image:
  repository: ghcr.io/yasindce1998/warmor
  tag: "latest"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

daemon:
  logLevel: info
  statsInterval: 30s
  metricsPort: 9090
  auditMode: false
  # Pass --lsm-enforce to the daemon: kernel-level blocking (EPERM) for
  # cached exec/connect denies. Requires CONFIG_BPF_LSM=y and "bpf" in
  # /sys/kernel/security/lsm on the nodes; without it the daemon degrades
  # to observe-only unless daemon.requireLSM is set.
  lsmEnforce: false
  # Refuse to start unless BPF-LSM kernel enforcement can be loaded.
  requireLSM: false
  # Pass --default-deny: preload the policy's static allow rules and refuse
  # (EPERM) exec/connect the policy does not allow, instead of allowing what
  # the kernel has not yet seen. Requires lsmEnforce and an allowlist policy
  # (default_action: deny + exact eq rules); see
  # docs/design/kernel-default-deny.md. Misses stay allowed when the policy
  # is not eligible.
  defaultDeny: false
  cgroupFilter: ""

policy:
  # The image ships with a default policy compiled in at build time
  # (deploy/default-policy.yaml -> /etc/warmor/policy.wasm). To use your own
  # policy, compile it on a machine with the Rust toolchain
  #   (warmor-compile -o policy.wasm my-policy.yaml)
  # and reference a ConfigMap that holds the resulting binary under the
  # "policy.wasm" key. The ConfigMap is mounted over /etc/warmor.
  existingConfigMap: ""

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

tolerations:
  - operator: Exists

nodeSelector: {}

affinity: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

priorityClass:
  enabled: true
  name: ""
  # 1000000000 is the maximum allowed for a user-defined PriorityClass.
  value: 1000000000

updateStrategy:
  type: RollingUpdate
  maxUnavailable: "10%"

networkPolicy:
  enabled: true
  extraEgress: []

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s
  additionalLabels: {}
  metricRelabelings: []
  relabelings: []

grafana:
  dashboardEnabled: false

alerting:
  enabled: false
  additionalLabels: {}
  rules:
    highDenyRate:
      enabled: true
      threshold: 10
      for: 5m
      severity: warning
    daemonDown:
      enabled: true
      for: 2m
      severity: critical
    highErrorRate:
      enabled: true
      threshold: 1
      for: 5m
      severity: warning
    ebpfLoaderFailure:
      enabled: true
      for: 1m
      severity: critical
    lsmEventsDropped:
      enabled: true
      for: 1m
      severity: critical
    wasmEvaluationErrors:
      enabled: true
      threshold: 0
      for: 2m
      severity: warning
    policyMapSyncFailures:
      enabled: true
      for: 5m
      severity: warning

webhook:
  enabled: false
  port: 9443
  certManager:
    enabled: false
    issuerRef: {}
  caBundle: ""
