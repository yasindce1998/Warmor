image:
  repository: ghcr.io/yasindce1998/warmor
  tag: "latest"
  digest: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

daemon:
  logLevel: info
  statsInterval: 30s
  metricsPort: 9090
  metricsBindAddress: ""
  # Start safely: no kernel blocking or process termination. Explicitly
  # set false only after validating policies and workload scope.
  auditMode: true
  # Pass --lsm-enforce to the daemon: kernel-level blocking (EPERM) for
  # cached exec/connect denies. Requires CONFIG_BPF_LSM=y and "bpf" in
  # /sys/kernel/security/lsm on the nodes; without it the daemon degrades
  # to observe-only unless daemon.requireLSM is set.
  lsmEnforce: false
  # Refuse to start unless BPF-LSM kernel enforcement can be loaded.
  requireLSM: false
  # Pass --default-deny: preload the policy's static allow rules and refuse
  # (EPERM) exec/connect the policy does not allow, instead of allowing what
  # the kernel has not yet seen. Requires lsmEnforce and an allowlist policy
  # (default_action: deny + exact eq rules); see
  # docs/design/kernel-default-deny.md. Misses stay allowed when the policy
  # is not eligible.
  defaultDeny: false
  # Covers all pods, including Warmor/system pods; NOT workload selectors.
  cgroupFilter: "auto"
  cgroupReconcileInterval: 1s
  confirmNodeWidePolicy: false

hostPaths:
  cgroup: /sys/fs/cgroup
  cgroupMount: /host/sys/fs/cgroup
  kernel: /sys/kernel

policy:
  # The image ships with a default policy compiled in at build time
  # (deploy/default-policy.yaml -> /etc/warmor/policy.wasm). To use your own
  # policy, compile it on a machine with the Rust toolchain
  #   (warmor-compile -o policy.wasm my-policy.yaml)
  # and reference a ConfigMap that holds the resulting binary under the
  # "policy.wasm" key. The ConfigMap is mounted over /etc/warmor.
  existingConfigMap: ""

# The WarmorPolicy controller turns warmorpolicies.warmor.io custom
# resources into the policy the agents run: it validates and compiles
# them (the controller image carries the Rust toolchain for this) and
# publishes the result in a ConfigMap the DaemonSet mounts. Agents pick
# changes up through their policy-file watcher, so updating a
# WarmorPolicy rolls out to every node without restarting anything.
#
# With controller.enabled the policy is managed exclusively through
# WarmorPolicy resources in the release namespace: the CRs fully define
# the effective policy (they replace, not extend, the baked default),
# and with no CRs at all the controller syncs the baked default from
# deploy/default-policy.yaml. policy.existingConfigMap is ignored in
# this mode.
controller:
  enabled: false
  # Disabled until operator provisions controller TLS, daemon CA trust and an
  # explicit complete desired node roster. Self-reports, NOT attestation.
  nodeReceipts:
    enabled: false
    audience: ""
    tlsSecretName: "" # tls.crt + tls.key for <release>-controller-receipts DNS
    caConfigMapName: "" # ca.crt, mounted only in daemon
    requiredNodes: [] # complete desired roster, not currently online nodes
    maxAge: 1m
  image:
    # The controller image is separate from the agent image because it
    # needs cargo at runtime to compile policies.
    repository: ghcr.io/yasindce1998/warmor-controller
    tag: "latest"
    digest: ""
    pullPolicy: IfNotPresent
  # Watch WarmorPolicies in every namespace instead of just the release
  # namespace. Single-tenant clusters only: any namespace could then
  # affect every node's policy.
  watchAllNamespaces: false
  # Re-reconcile this often even without events, healing out-of-band
  # edits to the policy ConfigMap.
  resyncPeriod: 10m
  cacheSizeLimit: 1Gi
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi


resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

tolerations:
  - operator: Exists

# Current published images/BPF objects target Linux amd64.
nodeSelector:
  kubernetes.io/os: linux
  kubernetes.io/arch: amd64

affinity: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

priorityClass:
  enabled: true
  name: ""
  # 1000000000 is the maximum allowed for a user-defined PriorityClass.
  value: 1000000000

updateStrategy:
  type: RollingUpdate
  maxUnavailable: "10%"

networkPolicy:
  enabled: true
  extraEgress: []

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s
  additionalLabels: {}
  metricRelabelings: []
  relabelings: []

grafana:
  dashboardEnabled: false

alerting:
  enabled: false
  additionalLabels: {}
  rules:
    highDenyRate:
      enabled: true
      threshold: 10
      for: 5m
      severity: warning
    daemonDown:
      enabled: true
      for: 2m
      severity: critical
    highErrorRate:
      enabled: true
      threshold: 1
      for: 5m
      severity: warning
    ebpfLoaderFailure:
      enabled: true
      for: 1m
      severity: critical
    lsmEventsDropped:
      enabled: true
      for: 1m
      severity: critical
    wasmEvaluationErrors:
      enabled: true
      threshold: 0
      for: 2m
      severity: warning
    policyMapSyncFailures:
      enabled: true
      for: 5m
      severity: warning

webhook:
  enabled: false
  port: 9443
  certManager:
    enabled: false
    issuerRef: {}
  caBundle: ""
