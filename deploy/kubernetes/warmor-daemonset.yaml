apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: warmor-agent
  namespace: warmor-system
  labels:
    app: warmor
    component: agent
spec:
  selector:
    matchLabels:
      app: warmor
      component: agent
  template:
    metadata:
      labels:
        app: warmor
        component: agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      hostPID: true
      hostNetwork: true
      serviceAccountName: warmor-agent
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      containers:
        - name: warmor-agent
          image: ghcr.io/yasindce1998/warmor:latest
          # warmor-daemon is configured only through flags (plus the optional
          # WARMOR_SERVER_TOKEN env var for JWT auth); see warmor-daemon -h.
          args:
            - "--audit"
            - "--cgroup-filter=auto"
            - "--cgroup-root=/host/sys/fs/cgroup"
            - "--server"
            - "https://warmor-server.warmor-system.svc:8443"
            # mTLS to the policy server. The warmor-agent-certs secret must
            # hold ca.crt, agent.crt and agent.key (as written by
            # `warmorctl certs`).
            - "--tls-ca"
            - "/etc/warmor/certs/ca.crt"
            - "--tls-cert"
            - "/etc/warmor/certs/agent.crt"
            - "--tls-key"
            - "/etc/warmor/certs/agent.key"
            - "--agent-id"
            - "$(NODE_NAME)"
            - "--metrics-port"
            - "9090"
            # Policies downloaded from the server are written here and
            # hot-reloaded; the directory persists on the node so a restart
            # starts from the last assigned policy. On a fresh node nothing
            # is there yet, so the daemon seeds it from the policy baked
            # into the image at startup and the first server download
            # replaces the seed.
            - "--policy"
            - "/var/lib/warmor/policy.wasm"
            - "--policy-fallback"
            - "/etc/warmor/policy.wasm"
          securityContext:
            privileged: false
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add:
                - SYS_ADMIN
                - BPF
                - PERFMON
          volumeMounts:
            - name: sys-kernel
              mountPath: /sys/kernel
              readOnly: true
            - name: host-cgroup
              mountPath: /host/sys/fs/cgroup
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: certs
              mountPath: /etc/warmor/certs
              readOnly: true
            - name: policy-state
              mountPath: /var/lib/warmor
          env:
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
            # Not read by the daemon; only expanded into --agent-id above.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 9090
              name: metrics
              protocol: TCP
          startupProbe:
            httpGet: {path: /health, port: metrics}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: metrics}
          readinessProbe:
            httpGet: {path: /ready, port: metrics}
      volumes:
        - name: sys-kernel
          hostPath:
            path: /sys/kernel
        - name: host-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: certs
          secret:
            secretName: warmor-agent-certs
        - name: policy-state
          hostPath:
            path: /var/lib/warmor
            type: DirectoryOrCreate
---
apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: false
metadata:
  name: warmor-agent
  namespace: warmor-system
